plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'com.yourname.yellowduck'
archivesBaseName = 'yellowduck'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                yellowduck {
                    source sourceSets.main
                }
            }
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "yellowduck",
                "Specification-Vendor"    : "yourname",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "yourname",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"          : "yellowduck.mixins.json"
        ])
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // Residence publishes its 6.0.0.1 API build through JitPack.
    // The API used by this mod (ResidenceApi / container flag) is also present in 6.0.2.4.
    maven { url = 'https://jitpack.io' }

    // Bukkit/Spigot API supplied by Mohist at runtime; compile only.
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }

    // GeckoLib
    maven { url = 'https://www.cursemaven.com' }

    // Local mods in libs/
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    implementation fg.deobf("curse.maven:geckolib-388172:6312918")
    implementation fg.deobf("libs:polymesh:1.0.0-forge")

    // Compile against the publicly published Residence API artifact.
    // Runtime remains the user's Residence 6.0.2.4.jar on Mohist.
    compileOnly('com.github.Zrips:Residence:6.0.0.1') {
        // Only the Residence classes are needed at compile time.
        // Do not pull Residence's optional plugin dependencies (Dynmap, WorldGuard,
        // WorldEdit, BigDoors, etc.) into this Forge build. Mohist/Residence supplies
        // those at runtime if installed.
        transitive = false
    }

    // Mohist supplies Bukkit at runtime.
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
